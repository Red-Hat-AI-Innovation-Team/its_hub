# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm>=8.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "its_hub"
description = "A Python library for inference-time scaling LLMs with particle filtering"
authors = [
    {name = "Kai Xu and the Red Hat AI Innovation Team", email = "xuk@redhat.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "typing-extensions>=4.12.2",
]

[tool.setuptools_scm]
version_file = "its_hub/_version.py"
# do not include +gREV local version, required for Test PyPI upload
local_scheme = "no-local-version"

[project.urls]
Homepage = "https://ai-innovation.team/its_hub"

[project.optional-dependencies]

lm = [
    "openai>=1.68.2",
    "aiohttp>=3.9.0",
    "backoff>=2.2.0",
    "certifi>=2026.2.25",
    "requests",
]

dev = [
    "its_hub[lm]",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.10.0",
    "python-dotenv>=1.0.0",
]

# For running the MMAU-Pro audio benchmark (benchmarking/mmau_pro/)
benchmark = [
    "its_hub[lm]",
    "click>=8.1.0",
    "pandas>=2.0.0",   # parquet loading in benchmarking/mmau_pro/loader.py
    "pyarrow>=14.0.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = [
    "its_hub",
    "its_hub.api",
    "its_hub.api.*",
    "its_hub.core",
    "its_hub.core.*",
]
