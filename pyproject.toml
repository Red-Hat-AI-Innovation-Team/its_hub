# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm>=8.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "its_hub"
description = "A Python library for inference-time scaling LLMs"
authors = [
    {name = "Kai Xu and the Red Hat AI Innovation Team", email = "xuk@redhat.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "typing-extensions>=4.12.2",
]

[project.scripts]
# its-iaas removed for MVP - will be added back in [iaas] extra

[tool.setuptools_scm]
version_file = "its_hub/_version.py"
# do not include +gREV local version, required for Test PyPI upload
local_scheme = "no-local-version"

[project.urls]
Homepage = "https://ai-innovation.team/its_hub"

[project.optional-dependencies]

lm = [
    "openai>=1.68.2",
    "aiohttp>=3.9.0",
    "backoff>=2.2.0",
    "requests",
]

iaas = [
    "its_hub[lm]",
    "fastapi>=0.115.5",
    "uvicorn",
    "pydantic>=2.7.2",
    "click>=8.1.0",
]

dev = [
    "its_hub[lm,iaas]",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.10.0",
    "python-dotenv>=1.0.0",
]

# Experimental - not officially supported in MVP
experimental = [
    "its_hub[lm]",
    "transformers>=4.53.2",
    "reward-hub>=0.1.7",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = [
    "its_hub",
    "its_hub.algorithms",
]

