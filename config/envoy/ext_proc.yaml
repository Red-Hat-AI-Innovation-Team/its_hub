# Envoy External Processor Configuration for ITS Gateway
#
# This configuration sets up Envoy as a transparent proxy that:
# 1. Intercepts HTTP requests to LLM endpoints
# 2. Applies Inference-Time Scaling (ITS) algorithms via external processor
# 3. Routes requests to upstream LLM service
#
# Architecture:
#   Client -> Envoy (port 8080) -> ext_proc gRPC (port 50051) -> LLM Backend (port 8100)
#
# Usage:
#   envoy -c config/envoy/ext_proc.yaml

admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      protocol: TCP
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        protocol: TCP
        address: 0.0.0.0
        port_value: 8108
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          http_filters:
          # External Processor Filter - applies ITS algorithms
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc:
                  cluster_name: ext_proc_cluster
                timeout: 120s  # Increased timeout for ITS processing
              failure_mode_allow: true  # Pass through on ext_proc failure (fail-safe)
              message_timeout: 120s  # Per-message timeout
              processing_mode:
                request_header_mode: SEND
                request_body_mode: BUFFERED
          # Router filter - forwards requests to upstream
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: llm_upstream
                  timeout: 300s  # 5 minute timeout for long LLM requests

  clusters:
  # External Processor gRPC Service
  - name: ext_proc_cluster
    connect_timeout: 5s
    type: LOGICAL_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: ext_proc_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 50051
    health_checks:
    - timeout: 1s
      interval: 10s
      unhealthy_threshold: 2
      healthy_threshold: 2
      grpc_health_check: {}

  # Upstream LLM Service (vLLM or OpenAI-compatible endpoint)
  - name: llm_upstream
    connect_timeout: 5s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: llm_upstream
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 8100
    health_checks:
    - timeout: 1s
      interval: 30s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_health_check:
        path: "/health"
        expected_statuses:
        - start: 200
          end: 299
