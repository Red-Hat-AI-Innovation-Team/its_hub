{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "its-hub.fullname" . }}
  labels:
    {{- include "its-hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "its-hub.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  {{- if .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8109
  {{- else }}
  ingress: []
  {{- end }}
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- end }}
{{- end }}
