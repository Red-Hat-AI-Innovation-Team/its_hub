name: Publish

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  container:
    name: Build and publish image to GHCR
    if: ${{ (github.repository_owner == 'Red-Hat-AI-Innovation-Team') && ((github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # setuptools_scm derives the package version from git history/tags.
          fetch-depth: 0

      - name: "Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: "Compute version"
        id: version
        # .git is excluded from the container build context (.dockerignore),
        # so resolve the setuptools_scm version here and pass it as a build-arg.
        # The CLI reads [tool.setuptools_scm] from pyproject.toml, so it honors
        # local_scheme = "no-local-version" (matching the published wheel).
        run: |
          version=$(uv run --no-project --with setuptools-scm python -m setuptools_scm)
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      - name: "Log in to GHCR"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "Extract metadata"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha

      - name: "Build and push"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          push: true
          build-args: |
            ITS_HUB_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
