# SPDX-License-Identifier: Apache-2.0

name: Build, test, and upload PyPI package

on:
    push:
        branches:
            - "main"
            - "release-**"
        tags:
            - "v*"
    pull_request:
        branches:
            - "main"
            - "release-**"
    release:
        types:
            - published

env:
    LC_ALL: en_US.UTF-8

defaults:
    run:
        shell: bash

permissions:
    contents: read

jobs:
    # The Rust/PyO3 extension requires platform-specific wheels (the compiled
    # .so/.dylib differs per OS and architecture).
    sdist:
        name: Build sdist
        runs-on: ubuntu-latest
        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

            - name: "Checkout"
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  submodules: true

            - name: "Install uv and setup python version"
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  python-version: "3.11"
                  enable-cache: false

            - name: "Install ext_proc build dependencies"
              run: uv sync --extra ext_proc

            # Generate the ext_proc proto modules so they are shipped in the
            # sdist too (maturin includes them from disk); otherwise only the
            # Linux wheels would carry them.
            - name: "Compile Envoy proto files"
              uses: ./.github/actions/compile-protos

            - name: "Set dev version"
              uses: ./.github/actions/set-dev-version

            - name: "Build sdist"
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  command: sdist
                  args: --out dist

            - name: "Upload sdist"
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: dist-sdist
                  path: dist/*.tar.gz
                  if-no-files-found: error

    # Cross-compiled inside manylinux containers by maturin-action
    linux-wheels:
        name: Build Linux wheels (${{ matrix.target }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                target: [x86_64, aarch64]
        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: "Checkout"
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  submodules: true

            - name: "Install uv and setup python version"
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
              with:
                  python-version: "3.11"
                  enable-cache: false

            - name: "Install ext_proc build dependencies"
              run: uv sync --extra ext_proc

            - name: "Compile Envoy proto files"
              uses: ./.github/actions/compile-protos

            - name: "Set dev version"
              uses: ./.github/actions/set-dev-version

            - name: "Build wheels"
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  target: ${{ matrix.target }}
                  manylinux: auto
                  # PyO3 0.24 supports up to Python 3.13; add 3.14 when PyO3 upgrades
                  args: --release --out dist -i python3.11 python3.12 python3.13

            - name: "Upload wheels"
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: dist-linux-${{ matrix.target }}
                  path: dist/*.whl
                  if-no-files-found: error

    # macOS needs setup-python to install interpreters; --find-interpreter
    # discovers them so maturin builds a wheel for each.
    macos-wheels:
        name: Build macOS wheels (${{ matrix.target }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-latest
                      target: aarch64-apple-darwin
                    - runner: macos-latest
                      target: x86_64-apple-darwin
        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: "Checkout"
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  submodules: true

            - name: "Set up Python"
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  # PyO3 0.24 supports up to Python 3.13; add 3.14 when PyO3 upgrades
                  python-version: |
                      3.11
                      3.12
                      3.13

            - name: "Install uv and setup python version"
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
              with:
                  python-version: "3.11"
                  enable-cache: false

            - name: "Install ext_proc build dependencies"
              run: uv sync --extra ext_proc

            # Generate the ext_proc proto modules so the macOS wheels ship them
            # too (maturin includes them from disk); otherwise only the Linux
            # wheels would carry them.
            - name: "Compile Envoy proto files"
              uses: ./.github/actions/compile-protos

            - name: "Set dev version"
              uses: ./.github/actions/set-dev-version

            - name: "Build wheels"
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  target: ${{ matrix.target }}
                  args: --release --out dist --find-interpreter

            - name: "Upload wheels"
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: dist-macos-${{ matrix.target }}
                  path: dist/*.whl
                  if-no-files-found: error

    # Guard against publishing wheels whose version disagrees with the release
    # tag. The version now comes from rust/Cargo.toml (used by maturin), so a
    # tag like v1.2.0 could otherwise ship wheels still labeled 1.1.0. Runs on
    # every trigger but only enforces on tag pushes / releases, so it always
    # completes and can safely gate the publish jobs via `needs`.
    check-version:
        name: Verify tag matches package version
        runs-on: ubuntu-latest
        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: "Checkout"
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: "Compare tag to rust/Cargo.toml version"
              run: |
                  if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
                      echo "Not a tag build (${GITHUB_REF}); skipping version check."
                      exit 0
                  fi
                  tag="${GITHUB_REF_NAME#v}"
                  version=$(grep -m1 '^version = ' rust/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
                  echo "tag=${tag} rust/Cargo.toml=${version}"
                  if [ "${tag}" != "${version}" ]; then
                      echo "::error::Release tag ${GITHUB_REF_NAME} does not match rust/Cargo.toml version ${version}"
                      exit 1
                  fi
                  echo "Version check passed: ${version}"

    # push to Test PyPI on
    # - a new GitHub release is published
    # - a PR is merged into main branch
    publish-test-pypi:
        name: Publish packages to test.pypi.org
        # environment: publish-test-pypi
        if: ${{ (github.repository_owner == 'Red-Hat-AI-Innovation-Team') && ((github.event.action == 'published') || ((github.event_name == 'push') && (github.ref == 'refs/heads/main'))) }}
        permissions:
            contents: read
            # see https://docs.pypi.org/trusted-publishers/
            id-token: write
        runs-on: ubuntu-latest
        needs: [check-version, sdist, linux-wheels, macos-wheels]

        environment:
            name: testpypi
            url: https://test.pypi.org/p/its-hub

        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

            - name: "Download build artifacts"
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: dist-*
                  merge-multiple: true
                  path: dist

            - name: "Validate packages"
              run: |
                  pip install twine==7.0.0
                  twine check dist/*

            - name: "Upload to Test PyPI"
              uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
              with:
                  repository-url: https://test.pypi.org/legacy/
                  # dev versions already keep each version unique; this only
                  # matters when the workflow is re-run on the same commit and
                  # some files from the earlier attempt already uploaded.
                  skip-existing: true

    # push to Production PyPI on
    # - a new GitHub release is published
    publish-pypi:
        name: Publish release to pypi.org
        # environment: publish-pypi
        if: ${{ (github.repository_owner == 'Red-Hat-AI-Innovation-Team') && (github.event.action == 'published') }}
        permissions:
            # see https://docs.pypi.org/trusted-publishers/
            id-token: write
            # allow gh release upload
            contents: write

        environment:
            name: pypi
            url: https://pypi.org/p/its-hub

        runs-on: ubuntu-latest
        needs: [check-version, sdist, linux-wheels, macos-wheels]

        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

            - name: "Download build artifacts"
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: dist-*
                  merge-multiple: true
                  path: dist

            - name: "Validate packages"
              run: |
                  pip install twine==7.0.0
                  twine check dist/*

            - name: "Sigstore sign package"
              uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
              with:
                  inputs: |
                      ./dist/*.tar.gz
                      ./dist/*.whl
                  release-signing-artifacts: false

            - name: "Upload artifacts and signatures to GitHub release"
              run: |
                  gh release upload '${{ github.ref_name }}' dist/* --repo '${{ github.repository }}'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # PyPI does not accept .sigstore artifacts and
            # gh-action-pypi-publish has no option to ignore them.
            - name: "Remove sigstore signatures before uploading to PyPI"
              run: |
                  rm ./dist/*.sigstore.json

            - name: "Upload to PyPI"
              uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
