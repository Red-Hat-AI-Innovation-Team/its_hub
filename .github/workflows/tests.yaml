name: Unit Tests

run-name: Run the unit test suite

on:
  push:
    branches:
      - "main"
      - "release-**"
  pull_request:
    branches:
      - "main"
      - "release-**"
    paths:
      - "its_hub/**"
      - "tests/**"
      - "!tests/e2e/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yaml"  # This workflow

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: true
    
    - name: Install uv and setup python version
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Compile Envoy proto files
      uses: ./.github/actions/compile-protos

    - name: Run unit tests with python ${{ matrix.python-version }}
      run: uv run pytest tests/ --ignore=tests/e2e --cov=its_hub --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false 
