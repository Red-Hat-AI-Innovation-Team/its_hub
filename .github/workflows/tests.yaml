name: Unit Tests

run-name: Run the unit test suite

on:
  push:
    branches:
      - "main"
      - "release-**"
  pull_request:
    branches:
      - "main"
      - "release-**"
    paths:
      - "its_hub/**"
      - "tests/**"
      - "!tests/e2e/**"
      - "rust/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yaml"  # This workflow

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PyO3 0.24 supports up to Python 3.13; add 3.14 when PyO3 upgrades
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        submodules: true
        persist-credentials: false

    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: rust

    - name: Run Rust tests
      run: cargo test --manifest-path rust/Cargo.toml

    - name: Install uv and setup python version
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Compile Envoy proto files
      uses: ./.github/actions/compile-protos

    - name: Run unit tests with python ${{ matrix.python-version }}
      run: uv run pytest tests/ --ignore=tests/e2e --cov=its_hub --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false 
