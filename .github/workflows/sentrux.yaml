name: Sentrux

on:
  push:
    branches:
      - "main"
      - "release-**"
  pull_request:
    branches:
      - "main"
      - "release-**"
    paths:
      - "its_hub/**"
      - ".sentrux/**"
      - ".github/workflows/sentrux.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install uv and setup python version
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Install Sentrux
      run: |
        curl -fsSL https://raw.githubusercontent.com/sentrux/sentrux/main/install.sh | sh
        echo "$HOME/.sentrux/bin" >> "$GITHUB_PATH"

    - name: Preserve sentrux config
      if: github.event_name == 'pull_request'
      run: cp -r .sentrux /tmp/.sentrux-config

    - name: Checkout base branch
      if: github.event_name == 'pull_request'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        clean: false

    - name: Restore sentrux config on base
      if: github.event_name == 'pull_request'
      run: cp -r /tmp/.sentrux-config .sentrux

    - name: Compile Envoy proto files (base)
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: ./.github/actions/compile-protos

    - name: Stage proto files for Sentrux (base)
      if: github.event_name == 'pull_request'
      continue-on-error: true
      run: git add -f its_hub/integration/proto/

    - name: Run Sentrux on base
      if: github.event_name == 'pull_request'
      id: base
      continue-on-error: true
      run: |
        output=$(sentrux check . 2>&1) || true
        echo "$output"
        score=$(echo "$output" | grep -oP 'Quality:\s*\K[0-9]+' || echo "N/A")
        echo "score=$score" >> "$GITHUB_OUTPUT"

    - name: Checkout PR head
      if: github.event_name == 'pull_request'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        clean: false

    - name: Compile Envoy proto files (head)
      continue-on-error: true
      uses: ./.github/actions/compile-protos

    - name: Stage proto files for Sentrux (head)
      continue-on-error: true
      run: git add -f its_hub/integration/proto/

    - name: Run Sentrux on head
      id: head
      continue-on-error: true
      run: |
        output=$(sentrux check . 2>&1) || true
        echo "$output"
        score=$(echo "$output" | grep -oP 'Quality:\s*\K[0-9]+' || echo "N/A")
        echo "score=$score" >> "$GITHUB_OUTPUT"

    - name: Compute delta
      if: github.event_name == 'pull_request'
      id: delta
      run: |
        base="${{ steps.base.outputs.score }}"
        head="${{ steps.head.outputs.score }}"
        if [[ "$base" =~ ^[0-9]+$ ]] && [[ "$head" =~ ^[0-9]+$ ]]; then
          diff=$((head - base))
          if [ "$diff" -gt 0 ]; then
            delta="+${diff} :arrow_up:"
          elif [ "$diff" -lt 0 ]; then
            delta="${diff} :arrow_down:"
          else
            delta="0 :left_right_arrow:"
          fi
        else
          delta="N/A"
        fi
        echo "delta=$delta" >> "$GITHUB_OUTPUT"

    - name: Post or update PR comment
      if: github.event_name == 'pull_request'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        marker="<!-- sentrux-quality-report -->"
        body="${marker}
        ## Sentrux Quality Report

        | Metric | Base | Head | Delta |
        |--------|------|------|-------|
        | Composite Quality | ${{ steps.base.outputs.score }} | ${{ steps.head.outputs.score }} | ${{ steps.delta.outputs.delta }} |

        <sub>Scale: 0 – 10,000. Higher is better.</sub>"

        comment_id=$(gh api \
          "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
          --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" \
          | head -1)

        if [ -n "$comment_id" ]; then
          gh api \
            --method PATCH \
            "repos/${{ github.repository }}/issues/comments/${comment_id}" \
            -f body="$body"
        else
          gh pr comment "${{ github.event.pull_request.number }}" --body "$body"
        fi
