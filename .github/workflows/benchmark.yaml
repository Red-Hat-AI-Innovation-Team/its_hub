name: Benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: "HuggingFace model to serve"
        required: false
        default: "Qwen/Qwen2.5-Math-1.5B-Instruct"
        type: string
      budgets:
        description: "Comma-separated list of budgets"
        required: true
        default: "1,2,4,8"
        type: string

jobs:
  benchmark:
    runs-on: self-hosted
    strategy:
      matrix:
        algorithm: [self-consistency, beam-search]
        dataset: [math500, aime-2024]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install uv and setup python version
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra dev --extra research --extra experimental

    - name: Start vLLM server
      id: vllm
      uses: ./.github/actions/setup-vllm
      with:
        model: ${{ inputs.model }}

    - name: Run benchmark
      run: |
        nohup uv run python benchmarking/benchmark.py \
          --endpoint ${{ steps.vllm.outputs.endpoint }} \
          --model_name ${{ steps.vllm.outputs.model }} \
          --alg ${{ matrix.algorithm }} \
          --benchmark ${{ matrix.dataset }} \
          --budgets ${{ inputs.budgets }} \
          --does_eval \
          2>&1 | tee benchmark-${{ matrix.algorithm }}-${{ matrix.dataset }}.log

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: benchmark-${{ matrix.algorithm }}-${{ matrix.dataset }}
        path: |
          results/
          benchmark-${{ matrix.algorithm }}-${{ matrix.dataset }}.log

    - name: Stop vLLM server
      if: always()
      run: |
        if [ -f /tmp/vllm.pid ]; then
          kill $(cat /tmp/vllm.pid) 2>/dev/null || true
        fi
