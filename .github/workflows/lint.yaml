name: Lint

on:
  push:
    branches:
      - "main"
      - "release-**"
  pull_request:
    branches:
      - "main"
      - "release-**"
    paths:
      - "its_hub/**"
      - "rust/**"
      - ".github/workflows/lint.yaml"  # This workflow

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        components: clippy

    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: rust
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install uv and setup python version
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run linting checks
      run: uv run ruff check its_hub/

    - name: Run formatting checks
      run: uv run ruff format --check its_hub/

    - name: Run clippy on rust
      run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
