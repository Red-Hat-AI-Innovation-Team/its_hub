name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      model:
        description: "HuggingFace model to serve"
        required: false
        default: "Qwen/Qwen2.5-Math-1.5B-Instruct"
        type: string

jobs:
  e2e:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install uv and setup python version
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Start vLLM server
      id: vllm
      uses: ./.github/actions/setup-vllm
      with:
        model: ${{ inputs.model }}

    - name: Run e2e tests
      env:
        OPENAI_API_KEY: NO_API_KEY
        OPENAI_ENDPOINT: ${{ steps.vllm.outputs.endpoint }}
        OPENAI_MODEL: ${{ steps.vllm.outputs.model }}
      run: uv run pytest tests/e2e/ -v

    - name: Stop vLLM server
      if: always()
      run: |
        if [ -f /tmp/vllm.pid ]; then
          kill $(cat /tmp/vllm.pid) 2>/dev/null || true
        fi
