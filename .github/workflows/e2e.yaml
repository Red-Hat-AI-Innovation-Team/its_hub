name: E2E Tests

on:
  workflow_dispatch:

env:
  VLLM_ENDPOINT: http://vllm-its-hub-svc.vllm.svc:8100/v1
  VLLM_MODEL: Qwen/Qwen2.5-Math-7B-Instruct

jobs:
  e2e:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install uv and setup python version
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run e2e tests
      run: |
        uv run python tests/e2e/test_e2e.py \
          --endpoint ${{ env.VLLM_ENDPOINT }} \
          --model_name ${{ env.VLLM_MODEL }} \
          --algorithms self-consistency
