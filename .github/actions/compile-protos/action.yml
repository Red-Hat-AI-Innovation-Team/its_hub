name: Compile Envoy Proto Files
description: Initialize submodules and compile proto files for ext_proc integration

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [ ! -f Makefile ] || ! grep -q 'proto-compile' Makefile; then
          echo "No proto-compile target found, skipping"
          exit 0
        fi
        git submodule update --init --recursive || true
        mkdir -p its_hub/integration/proto
        printf 'import sys\nfrom pathlib import Path\n\n_proto_dir = Path(__file__).parent\nif str(_proto_dir) not in sys.path:\n    sys.path.insert(0, str(_proto_dir))\n' > its_hub/integration/proto/__init__.py
        make proto-compile
