name: "Setup vLLM"
description: "Start a vLLM server on the self-hosted runner"

inputs:
  model:
    description: "HuggingFace model to serve"
    required: false
    default: "Qwen/Qwen2.5-Math-1.5B-Instruct"
  port:
    description: "Port to serve on"
    required: false
    default: "8100"
  max_wait:
    description: "Max seconds to wait for vLLM to become healthy"
    required: false
    default: "300"

outputs:
  endpoint:
    description: "vLLM OpenAI-compatible endpoint URL"
    value: ${{ steps.start.outputs.endpoint }}
  model:
    description: "Model name being served"
    value: ${{ inputs.model }}

runs:
  using: "composite"
  steps:
    - name: Install vLLM
      shell: bash
      run: uv pip install vllm

    - name: Start vLLM server
      id: start
      shell: bash
      run: |
        echo "Starting vLLM server with model ${{ inputs.model }} on port ${{ inputs.port }}"
        nohup vllm serve ${{ inputs.model }} \
          --port ${{ inputs.port }} \
          --trust-remote-code \
          > /tmp/vllm.log 2>&1 &
        echo $! > /tmp/vllm.pid
        echo "endpoint=http://localhost:${{ inputs.port }}/v1" >> "$GITHUB_OUTPUT"

    - name: Wait for vLLM to be healthy
      shell: bash
      run: |
        echo "Waiting for vLLM to be ready (max ${{ inputs.max_wait }}s)..."
        elapsed=0
        while [ $elapsed -lt ${{ inputs.max_wait }} ]; do
          if curl -s http://localhost:${{ inputs.port }}/v1/models > /dev/null 2>&1; then
            echo "vLLM is ready after ${elapsed}s"
            exit 0
          fi
          sleep 5
          elapsed=$((elapsed + 5))
        done
        echo "vLLM failed to start within ${{ inputs.max_wait }}s"
        echo "--- vLLM logs ---"
        cat /tmp/vllm.log
        exit 1
