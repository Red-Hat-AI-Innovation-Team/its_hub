# Envoy External Processor Configuration for ITS Gateway
#
# This configuration sets up Envoy as a transparent proxy that:
# 1. Intercepts HTTP requests to LLM endpoints
# 2. Applies Inference-Time Scaling (ITS) algorithms via external processor
# 3. Routes requests to upstream LLM service
#
# Architecture:
#   Client -> Envoy (port 8108) -> ext_proc gRPC (port 50051) -> LLM Backend (port 8100)
#
# Usage:
#   make envoy-stack    # Starts both Envoy and ext_proc gRPC service
#   # Or separately:
#   make envoy-start    # Just Envoy proxy
#   make envoy-grpc     # Just ext_proc gRPC service
#
# Customization Guide:
# ====================
# 1. Change Envoy listening port: Update port_value under listeners[0].address (default: 8108)
# 2. Change ext_proc gRPC port: Update port_value in ext_proc_cluster endpoints (default: 50051)
# 3. Change upstream LLM endpoint: Update address/port in llm_upstream cluster (default: localhost:8100)
# 4. Adjust ITS processing timeout: Update timeout/message_timeout in ext_proc filter (default: 120s)
# 5. Change failure behavior: Set failure_mode_allow to false to reject requests when ext_proc is down
# 6. Adjust LLM request timeout: Update timeout in route_config (default: 300s)

# ==============================================================================
# Admin Interface - Monitoring and Debugging
# ==============================================================================
# Access at http://localhost:9901 for stats, health checks, and configuration
admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      protocol: TCP
      address: 127.0.0.1
      port_value: 9901  # Admin interface port (change if 9901 conflicts)

# ==============================================================================
# Static Resources Configuration
# ==============================================================================
static_resources:
  # ------------------------------------------------------------------------------
  # LISTENER - Client-facing HTTP proxy
  # ------------------------------------------------------------------------------
  listeners:
  - name: listener_0
    address:
      socket_address:
        protocol: TCP
        address: 127.0.0.1  # Localhost only (use 0.0.0.0 to listen on all interfaces)
        port_value: 8108  # **CUSTOMIZE**: Client request port (your API gateway endpoint)
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          http_filters:
          # ----------------------------------------------------------------------
          # External Processor Filter - ITS Algorithm Execution
          # ----------------------------------------------------------------------
          # This filter sends requests to the ext_proc gRPC service which:
          # - Checks for ITS headers (X-ITS-Budget, X-ITS-Endpoint, X-ITS-API-Key)
          # - Applies self-consistency algorithm if headers present
          # - Returns aggregated response or passes through to upstream
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc:
                  cluster_name: ext_proc_cluster
                timeout: 120s  # **CUSTOMIZE**: Max time for ITS processing (increase for large budgets)
              # **IMPORTANT**: Fail-safe mode - allows requests through if ext_proc is down
              # Set to false to reject requests when ext_proc unavailable
              failure_mode_allow: true
              message_timeout: 120s  # **CUSTOMIZE**: Per-message timeout (should match timeout above)
              # **CRITICAL**: Must send headers AND buffer body for ITS to work
              processing_mode:
                request_header_mode: SEND      # Send headers to ext_proc (needed to check ITS headers)
                request_body_mode: BUFFERED    # Buffer and send body (needed to extract model name)
          # ----------------------------------------------------------------------
          # Router Filter - Routes to Upstream LLM
          # ----------------------------------------------------------------------
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          # Route Configuration
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]  # Accept all domains (restrict if needed for security)
              routes:
              - match:
                  prefix: "/"  # Match all paths
                # Strip X-ITS-* headers at route level so they never leak upstream,
                # even when ext_proc is unavailable (failure_mode_allow: true).
                request_headers_to_remove:
                - x-its-budget
                - x-its-endpoint
                - x-its-api-key
                route:
                  cluster: llm_upstream
                  # **CUSTOMIZE**: Timeout for upstream LLM requests (5 minutes default)
                  # Increase for slow models or complex reasoning tasks
                  timeout: 300s

  # ----------------------------------------------------------------------------
  # CLUSTERS - Backend Services
  # ----------------------------------------------------------------------------
  clusters:
  # External Processor gRPC Service (ITS algorithm executor)
  # Started via: make envoy-grpc
  - name: ext_proc_cluster
    connect_timeout: 5s
    type: LOGICAL_DNS
    # **REQUIRED**: HTTP/2 for gRPC communication
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: ext_proc_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1  # **CUSTOMIZE**: ext_proc service host (use service name for k8s)
                port_value: 50051   # **CUSTOMIZE**: ext_proc gRPC port (must match envoy-grpc service)
    # Health checks for ext_proc service
    health_checks:
    - timeout: 1s
      interval: 10s
      unhealthy_threshold: 2
      healthy_threshold: 2
      grpc_health_check: {}  # gRPC health check protocol

  # Upstream LLM Service (fallback when ITS headers not present)
  # **CUSTOMIZE THIS**: Point to your actual LLM endpoint (vLLM, OpenAI-compatible, etc.)
  - name: llm_upstream
    connect_timeout: 5s
    type: LOGICAL_DNS  # Use STRICT_DNS for k8s services, STATIC for IP addresses
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: llm_upstream
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                # **CUSTOMIZE**: Your LLM endpoint
                # Examples:
                #   - Local vLLM: 127.0.0.1:8000
                #   - Kubernetes service: llm-service.default.svc.cluster.local:8000
                #   - Remote endpoint: llm.example.com:443
                address: 127.0.0.1
                port_value: 8100  # **CUSTOMIZE**: Your LLM service port
    # Health checks for upstream LLM
    health_checks:
    - timeout: 1s
      interval: 30s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_health_check:
        path: "/health"  # **CUSTOMIZE**: Change to match your LLM's health endpoint
        expected_statuses:
        - start: 200
          end: 299
